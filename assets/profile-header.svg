
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101116"/>
      <stop offset="100%" stop-color="#171522"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".035" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="230" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="230" rx="14" fill="url(#grid)"/>
  <circle cx="1000" cy="105" r="220" fill="url(#glow)"/>

  <text x="58" y="48" fill="#A78BFA" font-family="monospace" font-size="12" letter-spacing="3">
    JOSHUA VINU KOSHY
  </text>

  <text x="58" y="111" fill="#F4F4F5" font-family="Arial, sans-serif" font-size="48" font-weight="bold" letter-spacing="-1.5">
    Building things that
  </text>
  <text x="58" y="164" fill="#A78BFA" font-family="Arial, sans-serif" font-size="48" font-weight="bold" letter-spacing="-1.5">
    make intelligence useful.
  </text>

  <text x="60" y="198" fill="#A1A1AA" font-family="monospace" font-size="12" letter-spacing="1">
    MSc COMPUTER SCIENCE  /  UNIVERSITY OF STUTTGART
  </text>

  <!-- Abstract orbital illustration -->
  <g transform="translate(1010 112)">
    <circle r="66" stroke="#A78BFA" stroke-opacity=".20" fill="none"/>
    <circle r="46" stroke="#A78BFA" stroke-opacity=".35" fill="none" stroke-dasharray="3 7"/>
    <circle r="26" stroke="#A78BFA" stroke-opacity=".55" fill="none"/>
    <circle r="8" fill="#A78BFA">
      <animate attributeName="opacity" values=".65;1;.65" dur="3s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="83" ry="29" transform="rotate(-35)" stroke="#A78BFA" stroke-opacity=".5" fill="none"/>
    <circle cx="67" cy="-47" r="4" fill="#A3E635"/>
  </g>

  <path d="M58 216H1142" stroke="#FFFFFF" stroke-opacity=".10"/>
</svg>
