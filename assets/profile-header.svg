
<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101116"/>
      <stop offset="1" stop-color="#171526"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8B5CF6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".045" fill="none"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <ellipse cx="960" cy="85" rx="230" ry="170" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="960;850;960" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="190" cy="320" rx="180" ry="110" fill="#6366F1" opacity=".09" filter="url(#blur)">
    <animate attributeName="cy" values="320;250;320" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <rect x="54" y="48" width="3" height="30" rx="1.5" fill="#A78BFA"/>

  <text x="76" y="68" fill="#A1A1AA" font-family="monospace" font-size="13" letter-spacing="3">
    JOSHUA VINU KOSHY / 2026
  </text>

  <text x="56" y="163" fill="#F4F4F5" font-family="Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">
    Engineering
  </text>
  <text x="56" y="235" fill="#F4F4F5" font-family="Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">
    <tspan fill="#A78BFA">intelligent</tspan> systems.
  </text>

  <text x="59" y="284" fill="#A1A1AA" font-family="monospace" font-size="13" letter-spacing="2">
    COMPUTER SCIENCE · AUTONOMOUS SYSTEMS · AI/ML
  </text>

  <circle cx="1104" cy="70" r="5" fill="#A3E635">
    <animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="1120" y="74" fill="#A1A1AA" font-family="monospace" font-size="10" text-anchor="end" transform="translate(-18 0)">
    AVAILABLE
  </text>

  <path d="M56 313H1144" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="57" y="330" fill="#71717A" font-family="monospace" font-size="9" letter-spacing="2">
    STUTTGART, GERMANY
  </text>
  <text x="1144" y="330" fill="#71717A" font-family="monospace" font-size="9" text-anchor="end">
    BUILD / EXPLORE / RESEARCH
  </text>
</svg>

